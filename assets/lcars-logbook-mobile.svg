<text x="48" y="1626" font-size="18" fill="#eee8e5">Human–AI collaboration in security</text>
<text x="48" y="1653" font-size="18" fill="#eee8e5">operations</text>
<rect x="48" y="1687" width="354" height="1" fill="#cc99cc"/>
<text x="48" y="1716" font-size="13" fill="#cc99cc" font-weight="bold">SCIENCE OFFICER&#x27;S NOTE</text>
<text x="48" y="1741" font-size="17" fill="#ffcc99">Research in progress — not a</text>
