<text x="48" y="79" font-size="20" fill="#eee8e5" font-weight="bold">ARNDT BOHRENKÄMPER</text>
<text x="48" y="111" font-size="14" fill="#cc99cc">TO BOLDLY GO WHERE NO ONE</text>
<text x="48" y="131" font-size="14" fill="#cc99cc">HAS GONE BEFORE</text>
<path d="M12 204V190Q12 165 37 165H402V172H46Q34 172 34 190V204Z" fill="#ff9966"/>
<text x="48" y="197" font-size="15" fill="#ff9966" font-weight="bold">01</text>
<text x="83" y="197" font-size="24" fill="#eee8e5" font-weight="bold">PERSONAL LOG</text>
<text x="48" y="224" font-size="15" fill="#ff9966" font-weight="bold">IDENTITY / BACKGROUND</text>
<text x="48" y="252" font-size="14" fill="#ff9966">SUBJECT: ARNDT BOHRENKÄMPER</text>
<text x="48" y="279" font-size="14" fill="#ff9966">CURIOUS · OPERATIONAL · STILL LEARNING</text>
<text x="48" y="316" font-size="18" fill="#eee8e5">Personal log. I&#x27;ve spent a fair amount of</text>
<text x="48" y="343" font-size="18" fill="#eee8e5">time exploring the wonderful universe of</text>
<text x="48" y="370" font-size="18" fill="#eee8e5">computers.</text>
<text x="48" y="408" font-size="18" fill="#eee8e5">Some people collect stamps; I collect</text>
<text x="48" y="435" font-size="18" fill="#eee8e5">questions about how technology works</text>
<text x="48" y="462" font-size="18" fill="#eee8e5">— and spare cables.</text>
<text x="48" y="500" font-size="18" fill="#eee8e5">My route hasn&#x27;t followed a standard</text>
<text x="48" y="527" font-size="18" fill="#eee8e5">flight plan: entrepreneurship, leadership</text>
<text x="48" y="554" font-size="18" fill="#eee8e5">and IT consulting.</text>
<text x="48" y="592" font-size="18" fill="#eee8e5">The best discoveries often begin with a</text>
<text x="48" y="619" font-size="18" fill="#eee8e5">simple question: Why does it work like</text>
<text x="48" y="646" font-size="18" fill="#eee8e5">that?</text>
<text x="48" y="684" font-size="18" fill="#eee8e5">Current interests: artificial intelligence,</text>
<text x="48" y="711" font-size="18" fill="#eee8e5">cybersecurity, Linux and connected</text>
<text x="48" y="738" font-size="18" fill="#eee8e5">systems.</text>
<rect x="12" y="212" width="22" height="364" fill="#ff9966"/>
<rect x="12" y="582" width="22" height="199" fill="#cc99cc"/>
<rect x="48" y="777" width="354" height="4" fill="#ff9966"/>
<path d="M12 858V844Q12 819 37 819H402V826H46Q34 826 34 844V858Z" fill="#cc99cc"/>
<text x="48" y="851" font-size="15" fill="#cc99cc" font-weight="bold">02</text>
<text x="83" y="851" font-size="24" fill="#eee8e5" font-weight="bold">MISSION LOG</text>
<text x="48" y="878" font-size="15" fill="#cc99cc" font-weight="bold">AQVIONIS / SECURITY RESEARCH</text>
<text x="48" y="906" font-size="14" fill="#cc99cc">CLASSIFICATION: EXPERIMENTAL RESEARCH</text>
<text x="48" y="933" font-size="14" fill="#cc99cc">STATUS: IN PROGRESS</text>
<text x="48" y="977" font-size="37" fill="#cc99cc" font-weight="bold">AQVIONIS</text>
<text x="48" y="1027" font-size="18" fill="#eee8e5">Mission objective: explore AI-assisted</text>
<text x="48" y="1054" font-size="18" fill="#eee8e5">detection of suspicious behaviour in</text>
<text x="48" y="1081" font-size="18" fill="#eee8e5">infrastructure.</text>
<text x="48" y="1119" font-size="18" fill="#eee8e5">Connect observations across systems</text>
<text x="48" y="1146" font-size="18" fill="#eee8e5">and time to reconstruct attack paths and</text>
<text x="48" y="1173" font-size="18" fill="#eee8e5">aid investigation.</text>
<text x="48" y="1211" font-size="14" fill="#cc99cc" font-weight="bold">SEC-01</text>
<text x="48" y="1235" font-size="18" fill="#eee8e5">AI-assisted threat hunting and anomaly</text>
<text x="48" y="1262" font-size="18" fill="#eee8e5">detection</text>
<text x="48" y="1300" font-size="14" fill="#cc99cc" font-weight="bold">OBS-02</text>
<text x="48" y="1324" font-size="18" fill="#eee8e5">Infrastructure, MCP and AI-agent</text>
<text x="48" y="1351" font-size="18" fill="#eee8e5">observability</text>
<text x="48" y="1389" font-size="14" fill="#cc99cc" font-weight="bold">GRAPH-03</text>
<text x="48" y="1413" font-size="18" fill="#eee8e5">Threat graphs and attack-path</text>
<text x="48" y="1440" font-size="18" fill="#eee8e5">visualisation</text>
<text x="48" y="1478" font-size="14" fill="#cc99cc" font-weight="bold">SIM-04</text>
<text x="48" y="1502" font-size="18" fill="#eee8e5">Counterfactual simulations</text>
