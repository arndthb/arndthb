<text x="48" y="1997" font-size="14" fill="#99bbee" font-weight="bold">COMPUTER CORE</text>
<text x="48" y="2021" font-size="18" fill="#eee8e5">Linux · Containers · Kubernetes ·</text>
<text x="48" y="2048" font-size="18" fill="#eee8e5">Automation · Networking</text>
<text x="48" y="2086" font-size="14" fill="#99bbee" font-weight="bold">AI LABORATORY</text>
<text x="48" y="2110" font-size="18" fill="#eee8e5">AI agents · Local language models ·</text>
