<text x="48" y="197" font-size="15" fill="#ff9966" font-weight="bold">01</text>
<text x="83" y="197" font-size="24" fill="#eee8e5" font-weight="bold">PERSONAL LOG</text>
<text x="48" y="224" font-size="15" fill="#ff9966" font-weight="bold">IDENTITY / BACKGROUND</text>
<text x="48" y="255" font-size="14" fill="#ff9966">SUBJECT: ARNDT BOHRENKÄMPER</text>
<text x="48" y="285" font-size="14" fill="#ff9966">CURIOUS · OPERATIONAL · STILL LEARNING</text>
<text x="48" y="325" font-size="20" fill="#eee8e5">Personal log. I&#x27;ve spent a fair amount</text>
<text x="48" y="355" font-size="20" fill="#eee8e5">of time exploring the wonderful</text>
<text x="48" y="385" font-size="20" fill="#eee8e5">universe of computers.</text>
<text x="48" y="426" font-size="20" fill="#eee8e5">Some people collect stamps; I</text>
<text x="48" y="456" font-size="20" fill="#eee8e5">collect questions about how</text>
<text x="48" y="486" font-size="20" fill="#eee8e5">technology works — and spare</text>
<text x="48" y="516" font-size="20" fill="#eee8e5">cables.</text>
<text x="48" y="557" font-size="20" fill="#eee8e5">My route hasn&#x27;t followed a standard</text>
<text x="48" y="587" font-size="20" fill="#eee8e5">flight plan: entrepreneurship,</text>
<text x="48" y="617" font-size="20" fill="#eee8e5">leadership and IT consulting.</text>
<text x="48" y="658" font-size="20" fill="#eee8e5">The best discoveries often begin</text>
<text x="48" y="688" font-size="20" fill="#eee8e5">with a simple question: Why does it</text>
<text x="48" y="718" font-size="20" fill="#eee8e5">work like that?</text>
<text x="48" y="759" font-size="20" fill="#eee8e5">Current interests: artificial</text>
<text x="48" y="789" font-size="20" fill="#eee8e5">intelligence, cybersecurity, Linux</text>
<text x="48" y="819" font-size="20" fill="#eee8e5">and connected systems.</text>
