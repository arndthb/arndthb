<text x="48" y="2438" font-size="14" fill="#99bbee" font-weight="bold">PHILOSOPHY DECK</text>
<text x="48" y="2462" font-size="20" fill="#eee8e5">Intelligence · Consciousness · The</text>
<text x="48" y="2492" font-size="20" fill="#eee8e5">origins and possibilities of life</text>
<text x="48" y="2533" font-size="20" fill="#eee8e5">The ship&#x27;s computer is excellent at</text>
<text x="48" y="2563" font-size="20" fill="#eee8e5">answering questions.</text>
<text x="48" y="2604" font-size="20" fill="#eee8e5">I find the unanswered ones even</text>
