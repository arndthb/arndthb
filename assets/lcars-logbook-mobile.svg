<text x="48" y="3173" font-size="15" fill="#cc99cc" font-weight="bold">05</text>
<text x="83" y="3173" font-size="24" fill="#eee8e5" font-weight="bold">CAPTAIN’S LOG</text>
<text x="48" y="3200" font-size="15" fill="#cc99cc" font-weight="bold">GUIDING PRINCIPLES</text>
<text x="48" y="3228" font-size="14" fill="#cc99cc">STANDING ORDERS: NEVER STOP EXPLORING</text>
<text x="48" y="3265" font-size="18" fill="#eee8e5">Stay curious. Learn the fundamentals.</text>
<text x="48" y="3292" font-size="18" fill="#eee8e5">Question assumptions. Improve what you</text>
<text x="48" y="3319" font-size="18" fill="#eee8e5">can.</text>
<text x="48" y="3357" font-size="18" fill="#eee8e5">Admit what you don&#x27;t know. Then find</text>
<text x="48" y="3384" font-size="18" fill="#eee8e5">out.</text>
<text x="48" y="3422" font-size="18" fill="#eee8e5">The universe is far too interesting to stop</text>
<text x="48" y="3449" font-size="18" fill="#eee8e5">asking questions.</text>
