<text x="83" y="3464" font-size="24" fill="#eee8e5" font-weight="bold">CAPTAIN’S LOG</text>
<text x="48" y="3491" font-size="15" fill="#cc99cc" font-weight="bold">GUIDING PRINCIPLES</text>
<text x="48" y="3522" font-size="14" fill="#cc99cc">STANDING ORDERS: NEVER STOP EXPLORING</text>
<text x="48" y="3562" font-size="20" fill="#eee8e5">Stay curious. Learn the</text>
<text x="48" y="3592" font-size="20" fill="#eee8e5">fundamentals. Question</text>
<text x="48" y="3622" font-size="20" fill="#eee8e5">assumptions. Improve what you can.</text>
<text x="48" y="3663" font-size="20" fill="#eee8e5">Admit what you don&#x27;t know. Then</text>
<text x="48" y="3693" font-size="20" fill="#eee8e5">find out.</text>
<text x="48" y="3734" font-size="20" fill="#eee8e5">The universe is far too interesting to</text>
<text x="48" y="3764" font-size="20" fill="#eee8e5">stop asking questions.</text>
