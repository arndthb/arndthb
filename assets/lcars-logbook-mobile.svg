<text x="48" y="2175" font-size="14" fill="#99bbee" font-weight="bold">SECURITY ARRAY</text>
<text x="48" y="2199" font-size="18" fill="#eee8e5">Threat hunting · Observability · Attack</text>
<text x="48" y="2226" font-size="18" fill="#eee8e5">graphs · Security research</text>
<text x="48" y="2264" font-size="14" fill="#99bbee" font-weight="bold">PHILOSOPHY DECK</text>
<text x="48" y="2288" font-size="18" fill="#eee8e5">Intelligence · Consciousness · The</text>
<text x="48" y="2315" font-size="18" fill="#eee8e5">origins and possibilities of life</text>
<text x="48" y="2353" font-size="18" fill="#eee8e5">The ship&#x27;s computer is excellent at</text>
<text x="48" y="2380" font-size="18" fill="#eee8e5">answering questions.</text>
<text x="48" y="2418" font-size="18" fill="#eee8e5">I find the unanswered ones even more</text>
<text x="48" y="2445" font-size="18" fill="#eee8e5">interesting.</text>
