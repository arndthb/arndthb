<text x="83" y="2558" font-size="24" fill="#eee8e5" font-weight="bold">OFF-DUTY LOG</text>
<text x="48" y="2585" font-size="15" fill="#ff9966" font-weight="bold">BEYOND THE KEYBOARD</text>
<text x="48" y="2613" font-size="14" fill="#ff9966">LOCATION: BETWEEN THE HOLODECK</text>
<text x="48" y="2640" font-size="14" fill="#ff9966">AND THE COMPUTER LAB</text>
<text x="48" y="2677" font-size="14" fill="#ff9966" font-weight="bold">STAR TREK</text>
<text x="48" y="2701" font-size="18" fill="#eee8e5">Exploration, science and imagining a</text>
<text x="48" y="2728" font-size="18" fill="#eee8e5">better tomorrow.</text>
<text x="48" y="2766" font-size="14" fill="#ff9966" font-weight="bold">RETRO GAMING</text>
<text x="48" y="2790" font-size="18" fill="#eee8e5">Classic point-and-click adventures; the</text>
<text x="48" y="2817" font-size="18" fill="#eee8e5">stranger the inventory, the better.</text>
<text x="48" y="2855" font-size="14" fill="#ff9966" font-weight="bold">COMPUTERS</text>
<text x="48" y="2879" font-size="18" fill="#eee8e5">Hardware, operating systems and</text>
<text x="48" y="2906" font-size="18" fill="#eee8e5">occasionally unnecessary experiments.</text>
<text x="48" y="2944" font-size="14" fill="#ff9966" font-weight="bold">MARTIAL ARTS</text>
<text x="48" y="2968" font-size="18" fill="#eee8e5">Shotokan Karate and Okinawan Kobudō</text>
<text x="48" y="2995" font-size="18" fill="#eee8e5">(Jinbukan tradition).</text>
<text x="48" y="3033" font-size="18" fill="#eee8e5">Different disciplines, familiar lessons:</text>
<text x="48" y="3060" font-size="18" fill="#eee8e5">patience, practice and attention to detail.</text>
