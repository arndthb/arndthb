<text x="105" y="1749" font-size="22" fill="#eee8e5">Linux · Containers · Kubernetes · Automation · Networking</text>
<text x="105" y="1793" font-size="16" fill="#99bbee" font-weight="bold">AI LABORATORY</text>
<text x="105" y="1819" font-size="22" fill="#eee8e5">AI agents · Local language models · Machine learning · AI security</text>
<text x="105" y="1863" font-size="16" fill="#99bbee" font-weight="bold">SECURITY ARRAY</text>
<text x="105" y="1889" font-size="22" fill="#eee8e5">Threat hunting · Observability · Attack graphs · Security research</text>
<text x="105" y="1933" font-size="16" fill="#99bbee" font-weight="bold">PHILOSOPHY DECK</text>
<text x="105" y="1959" font-size="22" fill="#eee8e5">Intelligence · Consciousness · The origins and possibilities of life</text>
<text x="105" y="2003" font-size="22" fill="#eee8e5">The ship&#x27;s computer is excellent at answering questions.</text>
<text x="105" y="2047" font-size="22" fill="#eee8e5">I find the unanswered ones even more interesting.</text>
