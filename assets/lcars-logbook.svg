<text x="980" y="58" font-size="25" fill="#eee8e5" font-weight="bold" text-anchor="end">ARNDT BOHRENKÄMPER</text>
<text x="105" y="93" font-size="18" fill="#cc99cc">TO BOLDLY GO WHERE NO ONE HAS GONE BEFORE</text>
<text x="980" y="93" font-size="16" fill="#cc99cc" text-anchor="end">LCARS 47 / LOG ACCESS</text>
