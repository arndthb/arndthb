<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2121" viewBox="0 0 1100 2121" role="img" aria-label="Arndt Bohrenkämper personal LCARS logbook"><rect width="1100" height="2121" fill="#10121d"/>
<rect x="28" y="25" width="1044" height="92" rx="35" fill="#e9a16d"/><rect x="28" y="78" width="1044" height="39" fill="#e9a16d"/><text x="62" y="66" font-size="32" font-weight="bold" font-family="Arial,sans-serif" fill="#17121e">PERSONAL LOGBOOK // ARNDT BOHRENKÄMPER</text><text x="63" y="102" font-size="19" font-family="Arial,sans-serif" fill="#17121e">TO BOLDLY GO WHERE NO ONE HAS GONE BEFORE</text>
<rect x="28" y="144" width="1044" height="340" rx="25" fill="#171b2b"/><path d="M132 156H1057V171H132Z" fill="#e9a16d"/><path d="M120 156H88Q43 156 43 202V470H84V209Q84 197 98 197H120Z" fill="#e9a16d"/><text x="103" y="234" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#f6e8df">01</text><text x="154" y="213" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#f5e8df">PERSONAL LOG</text><text x="1051" y="212" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#e9a16d">IDENTITY / BACKGROUND</text>
<text x="155" y="255" font-family="Arial,sans-serif" font-size="17" fill="#e9a16d">SUBJECT: ARNDT BOHRENKÄMPER    //    STATUS: CURIOUS · OPERATIONAL · STILL LEARNING</text>
<text x="155" y="289" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Personal log. I've spent a fair amount of time exploring the wonderful universe of computers.</text>
<text x="155" y="323" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Some people collect stamps; I collect questions about how technology works — and spare cables.</text>
<text x="155" y="357" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">My route hasn't followed a standard flight plan: entrepreneurship, leadership and IT consulting.</text>
<text x="155" y="391" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">The best discoveries often begin with a simple question: Why does it work like that?</text>
<text x="155" y="425" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Current interests: artificial intelligence, cybersecurity, Linux and connected systems.</text>
<rect x="28" y="502" width="1044" height="476" rx="25" fill="#171b2b"/><path d="M132 514H1057V529H132Z" fill="#ae9bce"/><path d="M120 514H88Q43 514 43 560V964H84V567Q84 555 98 555H120Z" fill="#ae9bce"/><text x="103" y="592" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#f6e8df">02</text><text x="154" y="571" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#f5e8df">CURRENT MISSION</text><text x="1051" y="570" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#ae9bce">AQVIONIS / SECURITY RESEARCH</text>
<text x="155" y="613" font-family="Arial,sans-serif" font-size="17" fill="#ae9bce">PROJECT: AQVIONIS    //    CLASSIFICATION: EXPERIMENTAL RESEARCH    //    STATUS: IN PROGRESS</text>
<text x="155" y="647" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Mission objective: explore AI-assisted detection of suspicious behaviour in infrastructure.</text>
<text x="155" y="681" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Connect observations across systems and time to reconstruct attack paths and aid investigation.</text>
<text x="155" y="715" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">SEC-01  AI-assisted threat hunting and anomaly detection</text>
<text x="155" y="749" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">OBS-02  Infrastructure, MCP and AI-agent observability</text>
<text x="155" y="783" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">GRAPH-03  Threat graphs and attack-path visualisation</text>
<text x="155" y="817" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">SIM-04  Counterfactual simulations</text>
<text x="155" y="851" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">MEM-05  Long-term threat memory</text>
<text x="155" y="885" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">HUM-06  Human–AI collaboration in security operations</text>
<text x="155" y="919" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">SCIENCE OFFICER'S NOTE: Research in progress — not a production-ready security product.</text>
<rect x="28" y="996" width="1044" height="374" rx="25" fill="#171b2b"/><path d="M132 1008H1057V1023H132Z" fill="#91afcf"/><path d="M120 1008H88Q43 1008 43 1054V1356H84V1061Q84 1049 98 1049H120Z" fill="#91afcf"/><text x="103" y="1086" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#f6e8df">03</text><text x="154" y="1065" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#f5e8df">AREAS OF EXPLORATION</text><text x="1051" y="1064" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#91afcf">SYSTEMS / AI / SECURITY</text>
<text x="155" y="1107" font-family="Arial,sans-serif" font-size="17" fill="#91afcf">SCIENCE LOG    //    DIRECTIVE: EXPLORE · EXPERIMENT · UNDERSTAND</text>
<text x="155" y="1141" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">COMPUTER CORE    Linux · Containers · Kubernetes · Automation · Networking</text>
<text x="155" y="1175" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">AI LABORATORY    AI agents · Local language models · Machine learning · AI security</text>
<text x="155" y="1209" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">SECURITY ARRAY    Threat hunting · Observability · Attack graphs · Security research</text>
<text x="155" y="1243" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">PHILOSOPHY DECK    Intelligence · Consciousness · The origins and possibilities of life</text>
<text x="155" y="1277" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">The ship's computer is excellent at answering questions.</text>
<text x="155" y="1311" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">I find the unanswered ones even more interesting.</text>
<rect x="28" y="1388" width="1044" height="340" rx="25" fill="#171b2b"/><path d="M132 1400H1057V1415H132Z" fill="#e9a16d"/><path d="M120 1400H88Q43 1400 43 1446V1714H84V1453Q84 1441 98 1441H120Z" fill="#e9a16d"/><text x="103" y="1478" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#f6e8df">04</text><text x="154" y="1457" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#f5e8df">BEYOND THE KEYBOARD</text><text x="1051" y="1456" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#e9a16d">HOLODECK / OFF-DUTY</text>
<text x="155" y="1499" font-family="Arial,sans-serif" font-size="17" fill="#e9a16d">OFF-DUTY LOG    //    LOCATION: BETWEEN THE HOLODECK AND THE COMPUTER LAB</text>
<text x="155" y="1533" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">STAR TREK    Exploration, science and imagining a better tomorrow. Yes, I'm a Trekkie.</text>
<text x="155" y="1567" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">RETRO GAMING    Classic point-and-click adventures; the stranger the inventory, the better.</text>
<text x="155" y="1601" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">COMPUTERS    Hardware, operating systems and occasionally unnecessary experiments.</text>
<text x="155" y="1635" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">MARTIAL ARTS    Shotokan Karate and Okinawan Kobudō (Jinbukan tradition).</text>
<text x="155" y="1669" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Different disciplines, familiar lessons: patience, practice and attention to detail.</text>
<rect x="28" y="1746" width="1044" height="272" rx="25" fill="#171b2b"/><path d="M132 1758H1057V1773H132Z" fill="#ae9bce"/><path d="M120 1758H88Q43 1758 43 1804V2004H84V1811Q84 1799 98 1799H120Z" fill="#ae9bce"/><text x="103" y="1836" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#f6e8df">05</text><text x="154" y="1815" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#f5e8df">GUIDING PRINCIPLES</text><text x="1051" y="1814" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#ae9bce">STANDING ORDERS</text>
<text x="155" y="1857" font-family="Arial,sans-serif" font-size="17" fill="#ae9bce">CAPTAIN'S LOG    //    STANDING ORDERS: NEVER STOP EXPLORING</text>
<text x="155" y="1891" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Stay curious. Learn the fundamentals. Question assumptions. Improve what you can.</text>
<text x="155" y="1925" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">Admit what you don't know. Then find out.</text>
<text x="155" y="1959" font-family="Arial,sans-serif" font-size="18" fill="#e7e7f0">The universe is far too interesting to stop asking questions.</text>
<rect x="28" y="2036" width="1044" height="64" rx="26" fill="#ae9bce"/><text x="550" y="2077" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#17121e">END OF PERSONAL LOG  //  LIVE LONG AND PROSPER</text>
