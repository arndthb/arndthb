<text x="105" y="1642" font-size="31" fill="#eee8e5" font-weight="bold">SCIENCE LOG</text>
<text x="980" y="1642" font-size="17" fill="#99bbee" text-anchor="end">AREAS OF EXPLORATION</text>
<text x="105" y="1679" font-size="16" fill="#99bbee">DIRECTIVE: EXPLORE · EXPERIMENT · UNDERSTAND</text>
