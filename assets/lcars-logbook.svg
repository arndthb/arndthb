<text x="49" y="2612" font-size="11" fill="#000000" text-anchor="middle">47-004</text>
<rect x="105" y="2622" width="875" height="4" fill="#ff9966"/>
<path d="M20 2732V2704Q20 2662 62 2662H980V2672H101Q78 2672 78 2696V2732Z" fill="#cc99cc"/>
<text x="49" y="2716" font-size="24" fill="#000000" font-weight="bold" text-anchor="middle">05</text>
<text x="105" y="2714" font-size="31" fill="#eee8e5" font-weight="bold">CAPTAIN’S LOG</text>
<text x="980" y="2714" font-size="17" fill="#cc99cc" text-anchor="end">GUIDING PRINCIPLES</text>
<text x="105" y="2751" font-size="16" fill="#cc99cc">STANDING ORDERS: NEVER STOP EXPLORING</text>
<text x="105" y="2795" font-size="22" fill="#eee8e5">Stay curious. Learn the fundamentals. Question assumptions. Improve what you can.</text>
<text x="105" y="2839" font-size="22" fill="#eee8e5">Admit what you don&#x27;t know. Then find out.</text>
<text x="105" y="2883" font-size="22" fill="#eee8e5">The universe is far too interesting to stop asking questions.</text>
