<text x="49" y="184" font-size="24" fill="#000000" font-weight="bold" text-anchor="middle">01</text>
<text x="105" y="182" font-size="31" fill="#eee8e5" font-weight="bold">PERSONAL LOG</text>
<text x="980" y="182" font-size="17" fill="#ff9966" text-anchor="end">IDENTITY / BACKGROUND</text>
<text x="105" y="219" font-size="16" fill="#ff9966">SUBJECT: ARNDT BOHRENKÄMPER</text>
<text x="105" y="251" font-size="16" fill="#ff9966">CURIOUS · OPERATIONAL · STILL LEARNING</text>
<text x="105" y="295" font-size="22" fill="#eee8e5">Personal log. I&#x27;ve spent a fair amount of time exploring the wonderful universe of</text>
<text x="105" y="327" font-size="22" fill="#eee8e5">computers.</text>
<text x="105" y="371" font-size="22" fill="#eee8e5">Some people collect stamps; I collect questions about how technology works — and</text>
<text x="105" y="403" font-size="22" fill="#eee8e5">spare cables.</text>
<text x="105" y="447" font-size="22" fill="#eee8e5">My route hasn&#x27;t followed a standard flight plan: entrepreneurship, leadership and IT</text>
<text x="105" y="479" font-size="22" fill="#eee8e5">consulting.</text>
<text x="105" y="523" font-size="22" fill="#eee8e5">The best discoveries often begin with a simple question: Why does it work like that?</text>
<text x="105" y="567" font-size="22" fill="#eee8e5">Current interests: artificial intelligence, cybersecurity, Linux and connected systems.</text>
<rect x="20" y="208" width="58" height="261" fill="#ff9966"/>
<rect x="20" y="475" width="58" height="141" fill="#cc99cc"/>
<text x="49" y="602" font-size="11" fill="#000000" text-anchor="middle">47-001</text>
<rect x="105" y="612" width="875" height="4" fill="#ff9966"/>
<path d="M20 722V694Q20 652 62 652H980V662H101Q78 662 78 686V722Z" fill="#cc99cc"/>
<text x="49" y="706" font-size="24" fill="#000000" font-weight="bold" text-anchor="middle">02</text>
<text x="105" y="704" font-size="31" fill="#eee8e5" font-weight="bold">MISSION LOG</text>
<text x="980" y="704" font-size="17" fill="#cc99cc" text-anchor="end">AQVIONIS / SECURITY RESEARCH</text>
<text x="105" y="741" font-size="16" fill="#cc99cc">CLASSIFICATION: EXPERIMENTAL RESEARCH</text>
<text x="105" y="773" font-size="16" fill="#cc99cc">STATUS: IN PROGRESS</text>
<text x="105" y="831" font-size="48" fill="#cc99cc" font-weight="bold">AQVIONIS</text>
<text x="105" y="887" font-size="22" fill="#eee8e5">Mission objective: explore AI-assisted detection of suspicious behaviour in</text>
<text x="105" y="919" font-size="22" fill="#eee8e5">infrastructure.</text>
<text x="105" y="963" font-size="22" fill="#eee8e5">Connect observations across systems and time to reconstruct attack paths and aid</text>
<text x="105" y="995" font-size="22" fill="#eee8e5">investigation.</text>
<text x="105" y="1039" font-size="16" fill="#cc99cc" font-weight="bold">SEC-01</text>
<text x="105" y="1065" font-size="22" fill="#eee8e5">AI-assisted threat hunting and anomaly detection</text>
<text x="105" y="1109" font-size="16" fill="#cc99cc" font-weight="bold">OBS-02</text>
<text x="105" y="1135" font-size="22" fill="#eee8e5">Infrastructure, MCP and AI-agent observability</text>
<text x="105" y="1179" font-size="16" fill="#cc99cc" font-weight="bold">GRAPH-03</text>
<text x="105" y="1205" font-size="22" fill="#eee8e5">Threat graphs and attack-path visualisation</text>
<text x="105" y="1249" font-size="16" fill="#cc99cc" font-weight="bold">SIM-04</text>
<text x="105" y="1275" font-size="22" fill="#eee8e5">Counterfactual simulations</text>
<text x="105" y="1319" font-size="16" fill="#cc99cc" font-weight="bold">MEM-05</text>
<text x="105" y="1345" font-size="22" fill="#eee8e5">Long-term threat memory</text>
<text x="105" y="1389" font-size="16" fill="#cc99cc" font-weight="bold">HUM-06</text>
<text x="105" y="1415" font-size="22" fill="#eee8e5">Human–AI collaboration in security operations</text>
<rect x="105" y="1455" width="875" height="1" fill="#cc99cc"/>
<text x="105" y="1484" font-size="16" fill="#cc99cc" font-weight="bold">SCIENCE OFFICER&#x27;S NOTE</text>
<text x="105" y="1509" font-size="21" fill="#ffcc99">Research in progress — not a production-ready security product.</text>
