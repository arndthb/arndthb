<text x="980" y="2184" font-size="17" fill="#ff9966" text-anchor="end">BEYOND THE KEYBOARD</text>
<text x="105" y="2221" font-size="16" fill="#ff9966">LOCATION: BETWEEN THE HOLODECK</text>
<text x="105" y="2253" font-size="16" fill="#ff9966">AND THE COMPUTER LAB</text>
<text x="105" y="2297" font-size="16" fill="#ff9966" font-weight="bold">STAR TREK</text>
<text x="105" y="2323" font-size="22" fill="#eee8e5">Exploration, science and imagining a better tomorrow. Yes, I&#x27;m a Trekkie.</text>
<text x="105" y="2367" font-size="16" fill="#ff9966" font-weight="bold">RETRO GAMING</text>
<text x="105" y="2393" font-size="22" fill="#eee8e5">Classic point-and-click adventures; the stranger the inventory, the better.</text>
<text x="105" y="2437" font-size="16" fill="#ff9966" font-weight="bold">COMPUTERS</text>
<text x="105" y="2463" font-size="22" fill="#eee8e5">Hardware, operating systems and occasionally unnecessary experiments.</text>
<text x="105" y="2507" font-size="16" fill="#ff9966" font-weight="bold">MARTIAL ARTS</text>
<text x="105" y="2533" font-size="22" fill="#eee8e5">Shotokan Karate and Okinawan Kobudō (Jinbukan tradition).</text>
<text x="105" y="2577" font-size="22" fill="#eee8e5">Different disciplines, familiar lessons: patience, practice and attention to detail.</text>
